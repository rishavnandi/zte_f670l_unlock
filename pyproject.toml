[project]
name = "zte_unlock"
version = "1.0.0"
description = "Open telnet on a ZTE ONU via factory mode, for the ZTE F670L unlock procedure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "WTFPL" }
keywords = ["zte", "f670l", "ont", "gpon", "airtel", "telnet"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

dependencies = [
    "cryptography>=42",  # AES-192-ECB, which the stdlib does not provide
    "psutil>=5.9",       # cross-platform interface enumeration for --check-mac
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
zte_unlock = "zte_unlock.factory_mode:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zte_unlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]